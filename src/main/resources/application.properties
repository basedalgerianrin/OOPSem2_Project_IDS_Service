spring.application.name=IDS_service
server.port=8082

# Where the attempts feed lives. Local dev defaults to the old Web_target port;
# in Docker this is overridden by WEB_TARGET_URL=http://alsatorix:8080.
web-target.url=${WEB_TARGET_URL:http://localhost:8081}

# Shared secret presented to the Alsatorix /api/attempts feed (X-IDS-Token).
# Must equal the FastAPI app's IDS_SHARED_SECRET. Empty by default for local dev.
ids.shared-secret=${IDS_SHARED_SECRET:}

# H2 database. File-backed so alerts (the SIEM history) survive restarts. In
# Docker, IDS_DB_PATH points at a mounted volume e.g. /data/idsdb.
spring.datasource.url=jdbc:h2:file:${IDS_DB_PATH:./data/idsdb}
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA - keep the schema across restarts now that storage is durable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pretty JSON. NOTE: Spring Boot 4 uses Jackson 3, which already serializes
# LocalDateTime as ISO-8601 strings by default (no write-dates-as-timestamps
# needed — that enum was removed in Jackson 3 and setting it crashes startup).
spring.jackson.serialization.indent-output=true
